# Global settings — column types come from the uploaded Excel file.

ignore_column_prefixes:
  - "__"

# How to find field types in the legacy file (first match wins):
#   sf_three_row_header — row 1=label, row 2=API name, row 3=data type (TestFile3 format)
#   type_row            — row 2 contains Salesforce types only
#   schema_sheet        — separate sheet with Field + Type columns
#   infer               — infer from Excel data types and column names
schema_detection: auto

schema_sheet_names:
  - Schema
  - Field Types
  - Types
  - Column Types
  - Metadata
